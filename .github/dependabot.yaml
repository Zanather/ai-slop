version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      timezone: America/Toronto
    commit-message:
      prefix: "⬆️ "
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      patch:
        update-types:
          - patch
      minor-development:
        update-types:
          - minor
        dependency-type: development
      minor-production:
        update-types:
          - minor
        dependency-type: production
      eslint:
        patterns:
          - "*eslint*"
          - globals
          - jiti
      prettier:
        patterns:
          - "*prettier*"
      typescript:
        patterns:
          - "*typescript*"
          - tsx
          - typedoc

  - package-ecosystem: gradle
    directory: /roku-remote
    schedule:
      interval: monthly
      timezone: America/Toronto
    commit-message:
      prefix: "⬆️ "
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      android:
        patterns:
          - androidx.*
          - com.android.*
          - org.jetbrains.kotlin*
          - org.jetbrains.kotlinx*
      testing:
        patterns:
          - io.github.takahirom.roborazzi*
          - junit*
          - org.robolectric*
          - com.google.truth*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: America/Toronto
    commit-message:
      prefix: "⬆️ "
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      actions:
        patterns:
          - actions/*
      docker:
        patterns:
          - docker/*
